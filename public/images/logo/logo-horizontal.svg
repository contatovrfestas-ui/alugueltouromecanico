    <path d="M28 38c0-3 2-6 5-7 2-1 4-1 6 0 1-3 4-5 7-5h8c4 0 7 2 9 5 2 0 4 1 6 2 2 1 3 3 3 5v3c0 4-3 7-7 7h-2v3c0 2-1 4-3 5l-2 1c-1 2-3 3-5 3h-3c-2 0-4-1-5-3l-2-1c-2-1-3-3-3-5v-3h-2c-4 0-7-3-7-7v-3z"/>
